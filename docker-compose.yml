# Laboratório completo da Lumio:
#   docker compose up --build
#   Dashboard (cadastro de OLTs):    http://localhost:3000
#   API da Lumio (Swagger):          http://localhost:8000/api/docs
#   API de cenários do simulador:    http://localhost:8080/docs
#   docker compose logs -f worker    # alarmes abertos/encerrados
#
# Os valores padrão abaixo (${VAR:-...}) servem só para desenvolvimento local.
# Em qualquer outro ambiente, copie .env.example para .env e troque tudo.
x-service-token: &service-token
  LUMIO_SERVICE_TOKEN: ${LUMIO_SERVICE_TOKEN:-dev-service-token-troque-em-producao}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lumio}
      POSTGRES_USER: ${POSTGRES_USER:-lumio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumio-dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  migrate:
    build: ./db
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lumio}:${POSTGRES_PASSWORD:-lumio-dev}@postgres:5432/${POSTGRES_DB:-lumio}
      LUMIO_APP_DB_PASSWORD: ${LUMIO_APP_DB_PASSWORD:-lumio-app-dev}
      LUMIO_SYSTEM_DB_PASSWORD: ${LUMIO_SYSTEM_DB_PASSWORD:-lumio-system-dev}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: api/Dockerfile }
    environment:
      <<: *service-token
      DATABASE_URL: postgresql://lumio_app:${LUMIO_APP_DB_PASSWORD:-lumio-app-dev}@postgres:5432/${POSTGRES_DB:-lumio}
      LUMIO_JWT_SECRET: ${LUMIO_JWT_SECRET:-dev-jwt-secret-com-pelo-menos-32-caracteres}
      # chave Fernet só de desenvolvimento; gere outra para produção (ver .env.example)
      LUMIO_SECRET_KEY: ${LUMIO_SECRET_KEY:-FzmoxWgkS_PkkB-SvoKahxsim_yz5CR0b6dZxP03CYU=}
      REDIS_URL: redis://redis:6379/0          # avisos em tempo real para o painel (SSE)
    ports:
      - "8000:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 2s
      retries: 30

  web:
    build: ./web
    ports:
      - "3000:80"
    depends_on:
      api: { condition: service_healthy }

  simulator:
    build: ./simulator
    command: ["python", "-m", "lumio_sim", "--config", "config/rede-exemplo.yaml", "--trap-target", "collector:1162"]
    ports:
      - "8080:8080"
      - "16101-16102:16101-16102/udp"   # para testar com snmpwalk da sua máquina

  collector:
    build: ./collector
    # OLTs vêm do cadastro na API (tela em localhost:3000), relidas a cada 30 s
    command: ["run-api", "--api-url", "http://api:8000"]
    environment:
      <<: *service-token
      REDIS_URL: redis://redis:6379/0
    depends_on:
      simulator: { condition: service_started }
      redis: { condition: service_healthy }
      api: { condition: service_healthy }

  worker:
    build: ./worker
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://lumio_system:${LUMIO_SYSTEM_DB_PASSWORD:-lumio-system-dev}@postgres:5432/${POSTGRES_DB:-lumio}
      LUMIO_RETENTION_DAYS: ${LUMIO_RETENTION_DAYS:-90}
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # Suíte de testes (não sobe no "up"): docker compose run --rm tests
  tests:
    build: { context: ., dockerfile: Dockerfile.test }
    profiles: [test]
    volumes: [".:/src"]
    environment:
      LUMIO_TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-lumio}:${POSTGRES_PASSWORD:-lumio-dev}@postgres:5432/postgres
      LUMIO_TEST_REDIS_URL: redis://redis:6379/15
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
