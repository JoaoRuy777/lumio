name: testes
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lumio
          POSTGRES_PASSWORD: lumio-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lumio" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    env:
      LUMIO_TEST_DATABASE_URL: postgresql://lumio:lumio-ci@localhost:5432/postgres
      LUMIO_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # -rs mostra testes pulados: no CI nenhum deveria ser pulado
      - run: pytest -v -rs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: docker compose up -d --build
      - run: ./scripts/smoke.sh
      # critério da sprint 4 num navegador de verdade: falha no simulador -> alarme no dashboard
      - name: e2e (Playwright)
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results
      - if: always()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down -v
